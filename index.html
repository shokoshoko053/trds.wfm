<script>
const STORAGE_KEY='deliveryWfmRecords';
const fields=['deliveryCount','kohaCount','pairKohaCount','actualCount','newCount','teamCount','teamSheets','supplyAmount'];
const labels={deliveryCount:'配送件数',kohaCount:'個配件数',pairKohaCount:'ペア個配件数',actualCount:'実配件数',newCount:'新規件数',teamCount:'班件数',teamSheets:'班配布枚数',supplyAmount:'供給金額'};
let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'),employee='',editingId=null;
// 数値欄をユーザーが明示的に入力・確認したかを記録。初期値の0だけでは検証を開始しない。
let touchedFields=new Set();
records.forEach(r=>{if(!r.id)r.id=makeId()});
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)}
function start(){document.getElementById('app').classList.remove('hidden');document.getElementById('date').value=localDate();const savedDate=localStorage.getItem('wfmDeliveryViewDate');const savedView=localStorage.getItem('wfmDeliveryView');if(savedDate!==localDate()){localStorage.setItem('wfmDeliveryViewDate',localDate());localStorage.setItem('wfmDeliveryView','input');tab('input')}else{tab(savedView==='my'?'my':'input')}save()}
function tab(t){['input','my'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));if(t==='my')renderMy();if(t==='input')validateForm();localStorage.setItem('wfmDeliveryViewDate',localDate());localStorage.setItem('wfmDeliveryView',t)}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function num(id){return Math.max(0,Number(document.getElementById(id).value)||0)}
function valuesFromForm(){const v={};fields.forEach(k=>v[k]=num(k));return v}
function getErrors(r){
 const e=[],delivery=Number(r.deliveryCount)||0,koha=Number(r.kohaCount)||0,pair=Number(r.pairKohaCount)||0,actual=Number(r.actualCount)||0,newc=Number(r.newCount)||0,sheets=Number(r.teamSheets)||0;
 const sum2=koha+pair*2, sum3=koha+sheets+pair*2;
 const mismatch=(sum)=>{const diff=sum-delivery;return diff>0?`${diff}件多い`:diff<0?`${Math.abs(diff)}件不足`:'一致'};
 if(actual>delivery)e.push({code:1,fields:['actualCount','deliveryCount'],message:`① 実配件数 ${actual}件 が配送件数 ${delivery}件 を超えています（${actual-delivery}件超過）。`});
 if(sum2!==delivery)e.push({code:2,fields:['kohaCount','pairKohaCount','deliveryCount'],message:`② 個配件数 ${koha}件 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum2}件。配送件数は ${delivery}件のため、${mismatch(sum2)}です。`});
 if(sum3!==delivery)e.push({code:3,fields:['kohaCount','teamSheets','pairKohaCount','deliveryCount'],message:`③ 個配件数 ${koha}件 ＋ 班配布枚数 ${sheets}枚 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum3}件。配送件数は ${delivery}件のため、${mismatch(sum3)}です。`});
 // 新規件数を含めると②または③の内訳が配送件数に一致する場合、④の可能性を表示
 const sum2WithNew=sum2+newc, sum3WithNew=sum3+newc;
 if(newc>0 && ((sum2WithNew===delivery && sum2!==delivery)||(sum3WithNew===delivery && sum3!==delivery))){
   const cases=[]; if(sum2WithNew===delivery&&sum2!==delivery)cases.push(`②の内訳 ${sum2}件 ＋ 新規件数 ${newc}件 ＝ ${sum2WithNew}件`); if(sum3WithNew===delivery&&sum3!==delivery)cases.push(`③の内訳 ${sum3}件 ＋ 新規件数 ${newc}件 ＝ ${sum3WithNew}件`);
   e.push({code:4,fields:['newCount','deliveryCount','kohaCount','pairKohaCount','teamSheets'],message:`④ 新規件数の計上方法を確認してください。${cases.join('／')}となり、配送件数 ${delivery}件と一致します。新規件数の扱いが内訳に反映されていない可能性があります。`});
 }
 return e;
}
function validateForm(){
 const box=document.getElementById('validation');if(!box)return;
 // 毎回いったん赤枠を解除。8つの数値欄をユーザーがすべて入力・確認するまでは検証しない。
 fields.forEach(k=>document.getElementById(k).classList.remove('invalid'));
 const allValuesPresent=!!document.getElementById('date').value && fields.every(k=>document.getElementById(k).value.trim()!=='');
 const allFieldsTouched=fields.every(k=>touchedFields.has(k));
 if(!allValuesPresent || !allFieldsTouched){
   box.classList.add('ok');
   box.innerHTML='<strong>入力待ち</strong><div class="note">配送件数だけでなく、8つすべての数値欄を入力・確認するとエラーチェックを開始します。0件の項目も、必要なら「0」を入力してください。</div>';
   return;
 }
 const r={...valuesFromForm()},errs=getErrors(r);
 const bad=new Set(errs.flatMap(x=>x.fields));bad.forEach(k=>{const el=document.getElementById(k);if(el)el.classList.add('invalid')});
 box.classList.toggle('ok',errs.length===0);
 box.innerHTML=errs.length?'<strong>入力エラーがあります（赤枠の項目を確認してください）</strong><ul>'+errs.map(x=>'<li><span class="error-detail">'+esc(x.message)+'</span></li>').join('')+'</ul><div class="hint">各エラーには、入力値・計算結果・配送件数との差を表示しています。</div>':'<strong>エラーはありません</strong><div class="note">すべての項目が入力され、設定されたチェック条件を満たしています。</div>';
}
function addRecord(){const date=document.getElementById('date').value;if(!date)return alert('日付を入力してください');const wasEditing=!!editingId;const r={...valuesFromForm(),id:editingId||makeId(),employee,date,createdAt:new Date().toISOString()};if(editingId){const ix=records.findIndex(x=>x.id===editingId);if(ix<0){editingId=null;return alert('訂正する記録が見つかりません。')}records[ix]={...records[ix],...r};}else records.unshift(r);save();clearForm();renderMy();renderDailySummary();tab('my');alert(wasEditing?'記録を訂正しました':'記録を保存しました');editingId=null;document.getElementById('saveButton').textContent='記録を保存'}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return alert('記録が見つかりません');editingId=id;touchedFields=new Set(fields);document.getElementById('date').value=r.date||localDate();fields.forEach(k=>document.getElementById(k).value=Number(r[k])||0);document.getElementById('saveButton').textContent='訂正内容を保存';tab('input');validateForm();window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editingId=null;touchedFields.clear();fields.forEach(k=>document.getElementById(k).value='');document.getElementById('date').value=localDate();document.getElementById('saveButton').textContent='記録を保存';validateForm()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(k,v){const n=Number(v)||0;return k==='supplyAmount'?n.toLocaleString('ja-JP')+'円':n.toLocaleString('ja-JP')}
function renderMy(){const rs=records.slice();const todayRecords=rs.filter(r=>(r.date||'')===localDate());document.getElementById('mySummary').innerHTML=`<div class="summary-heading" style="grid-column:1/-1;font-weight:700;font-size:14px;padding:2px 0 4px">今日（${localDate()}）の実績合計</div>`+fields.map(k=>`<div class="metric">${labels[k]} 合計<strong>${todayRecords.length?fmt(k,todayRecords.reduce((a,r)=>a+(Number(r[k])||0),0)):'未入力'}</strong></div>`).join('')+(todayRecords.length?'':'<p class="note" style="grid-column:1/-1">今日はまだ配送実績が登録されていません。</p>');document.getElementById('myRows').innerHTML=rs.map(r=>{const errs=getErrors(r);return `<tr><td>${esc(r.date||'')}</td>${fields.map(k=>`<td>${fmt(k,r[k])}</td>`).join('')}<td class="error-cell">${errs.length?'<ul>'+errs.map(x=>'<li>'+esc(x.message)+'</li>').join('')+'</ul>':'<span class="oktext">エラーなし</span>'}</td><td><button class="editbtn" onclick="editRecord('${esc(r.id)}')">訂正</button><button class="danger" onclick="deleteRecord('${esc(r.id)}')">削除</button></td></tr>`}).join('');document.getElementById('myEmpty').classList.toggle('hidden',rs.length>0)}
function deleteRecord(id){const ix=records.findIndex(r=>r.id===id);if(ix<0)return;if(confirm('この記録を削除しますか？')){records.splice(ix,1);save();renderMy()}}
fields.forEach(k=>{const el=document.getElementById(k);const markTouched=()=>{touchedFields.add(k);validateForm()};el.addEventListener('input',markTouched);el.addEventListener('change',markTouched)});
document.getElementById('date').addEventListener('change',validateForm);
function escDaily(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderDailySummary(){
 const date=document.getElementById('summaryDate').value||localDate();
 let distances=[],deliveries=[];
 try{distances=JSON.parse(localStorage.getItem('truckDistanceTimeRecords')||'[]').filter(r=>(r.date||'')===date)}catch(e){}
 try{deliveries=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>(r.date||'')===date)}catch(e){}
 const readyEl=document.getElementById('dailyReadyStatus');
 if(readyEl){const isToday=date===localDate();const both=distances.length>0&&deliveries.length>0;readyEl.textContent=both?(isToday?'本日の「距離・時間」と「配送実績」が両方保存されています。日別まとめを確認できます。':'この日付は両方の記録が保存されています。'):(isToday?`本日の記録状況：距離・時間 ${distances.length?'保存済み':'未保存'} ／ 配送実績 ${deliveries.length?'保存済み':'未保存'}。両方を保存すると、ここにまとめて表示されます。`:`この日付の記録状況：距離・時間 ${distances.length?'保存済み':'未保存'} ／ 配送実績 ${deliveries.length?'保存済み':'未保存'}。`);readyEl.style.background=both?'#e8f5e9':'#f1f5f9';}
 const total=(arr,key)=>arr.reduce((n,r)=>n+(Number(r[key])||0),0);
 const km=distances.reduce((n,r)=>n+(r.kmDepart!==''&&r.kmReturn!==''&&Number(r.kmReturn)>=Number(r.kmDepart)?Number(r.kmReturn)-Number(r.kmDepart):0),0);
 const dfields=[['deliveryCount','配送件数'],['kohaCount','個配件数'],['pairKohaCount','ペア個配件数'],['actualCount','実配件数'],['newCount','新規件数'],['teamCount','班件数'],['teamSheets','班配布枚数'],['supplyAmount','供給金額']];
 const stops=[['センター出発','depart','kmDepart'],['1件目到着','first','kmFirst'],['最終納品','last','kmLast'],['センター帰着','return','kmReturn']];
 document.getElementById('dailySummary').innerHTML=`<div class="summary">${stops.map(([label,timeKey,kmKey])=>{const rows=distances.length?distances.map(r=>{const t=r.times||{};const time=t[timeKey]||'—';const value=r[kmKey]!==''&&r[kmKey]!=null?Number(r[kmKey]).toLocaleString('ja-JP')+' km':'— km';return `<div class="stop-value"><strong>${escDaily(time)}</strong><span>${escDaily(value)}</span></div>`}).join(''):'<div class="stop-value"><strong>—</strong><span>— km</span></div>';return `<div class="metric stop-metric">${label}${rows}</div>`}).join('')}</div>`;
 document.getElementById('dailyDelivery').innerHTML=deliveries.length?`<div class="summary">${dfields.map(([k,label])=>`<div class="metric">${label}合計<strong>${total(deliveries,k).toLocaleString('ja-JP')}${k==='supplyAmount'?'円':''}</strong></div>`).join('')}</div>`+deliveries.map(r=>`<div class="record"><div class="recordtop"><strong>配送実績</strong><small>${escDaily(r.date)}</small></div><div class="recordstats">${dfields.map(([k,label])=>`${label}：${k==='supplyAmount'?(Number(r[k])||0).toLocaleString('ja-JP')+'円':(Number(r[k])||0).toLocaleString('ja-JP')}`).join('　/　')}</div></div>`).join(''):'<p class="note">この日付の配送実績はありません。</p>';
}
document.getElementById('summaryDate').value=localDate();document.getElementById('summaryDate').addEventListener('change',renderDailySummary);
window.addEventListener('storage',function(e){if(e.key==='truckDistanceTimeRecords'||e.key===STORAGE_KEY)renderDailySummary()});
