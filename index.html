*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;margin:0;background:#f3f5f8;color:#202938}header{background:#172033;color:white;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #0002}header h1{font-size:21px;margin:0 0 5px}header .sub{font-size:12px;color:#cbd5e1}main{max-width:900px;margin:16px auto;padding:0 12px 30px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;min-width:0;font-size:13px;font-weight:700}input{display:block;min-width:0;max-width:100%;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd2de;border-radius:9px;font-size:16px;background:#fff;color:#202938}input[type="date"]{width:100%;min-width:0;max-width:100%;appearance:none;-webkit-appearance:none} .grid>label{min-width:0;overflow:hidden} input.invalid{border:2px solid #dc2626!important;background:#fff1f2!important;box-shadow:0 0 0 2px #fecaca!important}input:focus{outline:2px solid #93c5fd;outline-offset:1px}input.invalid:focus{outline-color:#dc2626}button{padding:12px 14px;border:0;border-radius:9px;background:#315efb;color:white;font-weight:700;font-size:15px;margin:5px 5px 0 0;cursor:pointer}.secondary{background:#e5e9f0;color:#263244}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;margin:0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f5f7fa;padding:12px;border-radius:9px;font-size:12px;color:#586174}.metric strong{display:block;font-size:22px;color:#172033;margin-top:5px;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}td,th{padding:9px;border-bottom:1px solid #e4e7ec;white-space:nowrap;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#f5f6f8}.note{font-size:12px;color:#667085;line-height:1.6}.badge{background:#e8efff;color:#315efb;padding:4px 8px;border-radius:20px;font-size:12px}.section-title{margin:0 0 14px;font-size:18px}.form-actions{display:flex;flex-wrap:wrap;margin-top:14px}.amount input{font-variant-numeric:tabular-nums}.errors{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:12px;border-radius:10px;margin-top:14px}.errors.ok{background:#ecfdf3;border-color:#a7f3d0;color:#166534}.errors ul{margin:8px 0 0;padding-left:20px}.errors li{margin:5px 0;line-height:1.5}.error-detail{font-weight:700}.errors .hint{font-size:12px;margin-top:8px}.error-cell{white-space:normal!important;text-align:left!important;min-width:240px;max-width:340px;color:#9f1239}.error-cell .oktext{color:#15803d}.editbtn{background:#e0f2fe;color:#075985}@media(min-width:650px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}header h1{font-size:19px}}

<div id="login" class="card login"><h1 style="text-align:center">WFM</h1><p>社員番号を入力してログイン</p><label>社員番号<input id="empId" inputmode="numeric" placeholder="例：10001" onkeydown="if(event.key==='Enter')loginUser()"></label><button style="width:100%;margin-top:15px" onclick="loginUser()">ログイン</button><p class="note">※社員番号による簡易ログインです。</p></div>

<section id="distancePanel"><iframe id="distanceFrame" title="距離・時間" style="width:100%;height:calc(100vh - 155px);min-height:760px;border:0;border-radius:12px;background:#f3f6f8" loading="eager" srcdoc="&lt;!doctype html&gt;\n&lt;html lang=\&quot;ja\&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=\&quot;utf-8\&quot;&gt;\n&lt;meta name=\&quot;viewport\&quot; content=\&quot;width=device-width, initial-scale=1, viewport-fit=cover\&quot;&gt;\n&lt;meta name=\&quot;theme-color\&quot; content=\&quot;#173b57\&quot;&gt;\n&lt;meta name=\&quot;apple-mobile-web-app-capable\&quot; content=\&quot;yes\&quot;&gt;\n&lt;meta name=\&quot;apple-mobile-web-app-status-bar-style\&quot; content=\&quot;black-translucent\&quot;&gt;\n&lt;meta name=\&quot;apple-mobile-web-app-title\&quot; content=\&quot;距離時間メモ\&quot;&gt;\n&lt;title&gt;トラック距離・時間メモ&lt;/title&gt;\n&lt;style&gt;\n:root{--navy:#173b57;--blue:#246b91;--bg:#f3f6f8;--line:#dce4ea;--text:#17232d;--muted:#657582;--green:#16815d;--red:#b33d3d}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,\&quot;Hiragino Kaku Gothic ProN\&quot;,Meiryo,sans-serif;color:var(--text);padding-bottom:28px}\nheader{background:linear-gradient(135deg,#173b57,#246b91);color:white;padding:22px 18px 20px;border-radius:0 0 22px 22px}\nheader .eyebrow{font-size:12px;opacity:.8;letter-spacing:.08em}h1{font-size:22px;margin:5px 0 7px}header p{font-size:13px;margin:0;opacity:.9}\nmain{max-width:720px;margin:auto;padding:14px}\n.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 13px;box-shadow:0 3px 12px #163b5710}\n.card h2{font-size:16px;margin:0 0 13px}.sub{font-size:12px;color:var(--muted);margin-top:-7px;margin-bottom:12px}\nlabel{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}\ninput,textarea{font:inherit;width:100%;border:1px solid #cbd6df;border-radius:10px;padding:12px;background:#fff;color:var(--text);min-height:44px}\ninput:focus,textarea:focus{outline:2px solid #8cc5e3;border-color:var(--blue)}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid&gt;div{min-width:0}.grid .full{grid-column:1/-1}input{min-width:0;max-width:100%}input[type=date]{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;padding-left:4px;padding-right:4px;font-size:16px}\n.stampgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}\nbutton{font:inherit;border:0;border-radius:11px;padding:12px 13px;min-height:44px;font-weight:700;cursor:pointer}\n.stamp{background:#eaf3f8;color:#174f70;text-align:left;border:1px solid #cfe1ec}\n.stamp small{display:block;font-size:11px;font-weight:500;color:#557182;margin-bottom:4px}\n.stamp strong{font-size:16px}.primary{background:var(--navy);color:#fff;width:100%;margin-top:14px}.secondary{background:#e9eef2;color:#304454}.danger{background:#fff0f0;color:var(--red)}\n.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f2f7fa;border-radius:12px;padding:12px}.metric span{font-size:12px;color:var(--muted);display:block}.metric strong{font-size:21px;display:block;margin-top:3px}\n.note{font-size:12px;color:var(--muted);line-height:1.5}.record{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}.recordtop{display:flex;justify-content:space-between;gap:8px;align-items:start}.recordtop strong{font-size:14px}.recordtop small{color:var(--muted)}.recordstats{font-size:13px;line-height:1.8;margin-top:8px}.recordactions{display:flex;gap:8px;margin-top:10px}.recordactions button{flex:1;font-size:12px;min-height:38px;padding:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}\n.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px}.status{font-size:12px;color:var(--green);min-height:18px;margin-top:8px}.save-indicator{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#edf7f2;color:#176448;font-size:13px;margin:10px 0 12px}.save-dot{width:9px;height:9px;border-radius:50%;background:#16815d;flex:none}.save-indicator.pending{background:#fff7e5;color:#805a0b}.save-indicator.pending .save-dot{background:#d69b18}.time-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.time-edit-grid&gt;div{min-width:0;overflow:hidden}.time-edit-grid label{font-size:12px;margin:9px 0 4px;line-height:1.25}.time-edit-grid input.time-display{display:block;width:100%;min-width:0;max-width:100%;min-height:34px;height:36px;padding:5px 6px;font-size:14px;border-radius:8px;letter-spacing:0;text-align:center;background:#f2f4f7;color:#344054;border:1px solid #d0d5dd;cursor:default}@media(max-width:380px){.time-edit-grid{gap:5px}.time-edit-grid input.time-display{font-size:13px;padding-left:2px;padding-right:2px}}\n@media(min-width:600px){main{padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.two .card{margin-bottom:13px}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;header&gt;&lt;div class=\&quot;eyebrow\&quot;&gt;DRIVER\\&#x27;S LOG&lt;/div&gt;&lt;h1&gt;🚚 距離・時間メモ&lt;/h1&gt;&lt;p&gt;距離を入力すると、その地点の時刻を自動記録。記録はこの端末に保存されます。&lt;/p&gt;&lt;/header&gt;\n&lt;main&gt;\n  &lt;section class=\&quot;card\&quot;&gt;\n    &lt;h2&gt;今日の記録&lt;/h2&gt;\n    &lt;div class=\&quot;grid\&quot;&gt;\n      &lt;div&gt;&lt;label for=\&quot;workDate\&quot;&gt;日付&lt;/label&gt;&lt;input id=\&quot;workDate\&quot; type=\&quot;date\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;routeName\&quot;&gt;コース&lt;/label&gt;&lt;input id=\&quot;routeName\&quot; inputmode=\&quot;numeric\&quot; autocomplete=\&quot;off\&quot; placeholder=\&quot;例：123\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;vehicleNo\&quot;&gt;車番&lt;/label&gt;&lt;input id=\&quot;vehicleNo\&quot; inputmode=\&quot;numeric\&quot; autocomplete=\&quot;off\&quot; placeholder=\&quot;例：1234\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;employeeNo\&quot;&gt;社員番号（記録者）&lt;/label&gt;&lt;input id=\&quot;employeeNo\&quot; inputmode=\&quot;numeric\&quot; autocomplete=\&quot;off\&quot; placeholder=\&quot;例：123456\&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;p class=\&quot;note\&quot;&gt;※ 社員番号は記録者を区別するための項目です。現在の公開版は簡易アプリのため、社員番号だけでは本人確認やアクセス制限はできません。&lt;/p&gt;\n    &lt;label&gt;時刻（自動記録後も手動で変更できます）&lt;/label&gt;\n    &lt;div class=\&quot;time-edit-grid\&quot;&gt;\n      &lt;div&gt;&lt;label for=\&quot;timeDepartInput\&quot;&gt;センター出発&lt;/label&gt;&lt;input id=\&quot;timeDepartInput\&quot; class=\&quot;time-display\&quot; type=\&quot;text\&quot; inputmode=\&quot;none\&quot; readonly aria-label=\&quot;センター出発時刻\&quot; title=\&quot;距離入力時に自動記録されます\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;timeFirstInput\&quot;&gt;1件目到着&lt;/label&gt;&lt;input id=\&quot;timeFirstInput\&quot; class=\&quot;time-display\&quot; type=\&quot;text\&quot; inputmode=\&quot;none\&quot; readonly aria-label=\&quot;1件目到着時刻\&quot; title=\&quot;距離入力時に自動記録されます\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;timeLastInput\&quot;&gt;最終納品&lt;/label&gt;&lt;input id=\&quot;timeLastInput\&quot; class=\&quot;time-display\&quot; type=\&quot;text\&quot; inputmode=\&quot;none\&quot; readonly aria-label=\&quot;最終納品時刻\&quot; title=\&quot;距離入力時に自動記録されます\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;timeReturnInput\&quot;&gt;センター帰着&lt;/label&gt;&lt;input id=\&quot;timeReturnInput\&quot; class=\&quot;time-display\&quot; type=\&quot;text\&quot; inputmode=\&quot;none\&quot; readonly aria-label=\&quot;センター帰着時刻\&quot; title=\&quot;距離入力時に自動記録されます\&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;label for=\&quot;breakMinutes\&quot;&gt;休憩時間（分）&lt;/label&gt;&lt;input id=\&quot;breakMinutes\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：60\&quot;&gt;\n  &lt;/section&gt;\n\n  &lt;section class=\&quot;card\&quot;&gt;\n    &lt;h2&gt;走行距離（km）&lt;/h2&gt;\n    &lt;p class=\&quot;sub\&quot;&gt;各地点のオドメーター数値を入力すると、対応する時刻も自動で記録します（既に時刻がある場合は上書きしません）。時刻は距離を入力した時点で自動記録され、手動タップでは変更されません。&lt;/p&gt;\n    &lt;div class=\&quot;grid\&quot;&gt;\n      &lt;div&gt;&lt;label for=\&quot;kmDepart\&quot;&gt;センター出発時&lt;/label&gt;&lt;input id=\&quot;kmDepart\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：12540\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;kmFirst\&quot;&gt;1件目&lt;/label&gt;&lt;input id=\&quot;kmFirst\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：12548\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;kmLast\&quot;&gt;最終納品先&lt;/label&gt;&lt;input id=\&quot;kmLast\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：12591\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;kmReturn\&quot;&gt;センター帰着時&lt;/label&gt;&lt;input id=\&quot;kmReturn\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：12610\&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=\&quot;summary\&quot; style=\&quot;margin-top:13px\&quot;&gt;\n      &lt;div class=\&quot;metric\&quot;&gt;&lt;span&gt;総走行距離&lt;/span&gt;&lt;strong id=\&quot;totalKm\&quot;&gt;— km&lt;/strong&gt;&lt;/div&gt;\n      &lt;div class=\&quot;metric\&quot;&gt;&lt;span&gt;出発〜1件目&lt;/span&gt;&lt;strong id=\&quot;firstKm\&quot;&gt;— km&lt;/strong&gt;&lt;/div&gt;\n      &lt;div class=\&quot;metric\&quot;&gt;&lt;span&gt;1件目〜最終納品&lt;/span&gt;&lt;strong id=\&quot;deliveryKm\&quot;&gt;— km&lt;/strong&gt;&lt;/div&gt;\n      &lt;div class=\&quot;metric\&quot;&gt;&lt;span&gt;最終納品〜帰着&lt;/span&gt;&lt;strong id=\&quot;returnKm\&quot;&gt;— km&lt;/strong&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;h3 style=\&quot;margin-top:18px\&quot;&gt;給油記録（任意）&lt;/h3&gt;\n    &lt;div class=\&quot;grid\&quot;&gt;\n      &lt;div&gt;&lt;label for=\&quot;fuelAmount\&quot;&gt;給油量（L）&lt;/label&gt;&lt;input id=\&quot;fuelAmount\&quot; type=\&quot;number\&quot; inputmode=\&quot;decimal\&quot; min=\&quot;0\&quot; step=\&quot;any\&quot; placeholder=\&quot;例：35.68\&quot;&gt;&lt;/div&gt;\n      &lt;div&gt;&lt;label for=\&quot;fuelDistance\&quot;&gt;給油時の走行距離（km）&lt;/label&gt;&lt;input id=\&quot;fuelDistance\&quot; type=\&quot;number\&quot; inputmode=\&quot;numeric\&quot; min=\&quot;0\&quot; step=\&quot;1\&quot; placeholder=\&quot;例：12580\&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=\&quot;save-indicator\&quot; id=\&quot;saveIndicator\&quot; role=\&quot;status\&quot; aria-live=\&quot;polite\&quot;&gt;&lt;span class=\&quot;save-dot\&quot;&gt;&lt;/span&gt;&lt;span id=\&quot;saveIndicatorText\&quot;&gt;自動保存の準備中&lt;/span&gt;&lt;/div&gt;\n    &lt;button class=\&quot;primary\&quot; id=\&quot;saveBtn\&quot;&gt;この日の記録を保存&lt;/button&gt;\n    &lt;div class=\&quot;status\&quot; id=\&quot;status\&quot; role=\&quot;status\&quot;&gt;&lt;/div&gt;\n    &lt;p class=\&quot;note\&quot;&gt;※ 距離は両方の数値が入力されている区間だけ計算します。時刻は日付をまたぐ場合も経過時間として計算します。&lt;/p&gt;\n  &lt;/section&gt;\n\n  &lt;section class=\&quot;card\&quot;&gt;\n    &lt;h2&gt;記録一覧&lt;/h2&gt;\n    &lt;div class=\&quot;toolbar\&quot;&gt;\n      &lt;button class=\&quot;secondary\&quot; id=\&quot;exportBtn\&quot;&gt;CSVを書き出す&lt;/button&gt;\n      &lt;button class=\&quot;secondary\&quot; id=\&quot;textExportBtn\&quot;&gt;テキストを書き出す&lt;/button&gt;\n      &lt;button class=\&quot;secondary\&quot; id=\&quot;newBtn\&quot;&gt;新しい記録&lt;/button&gt;\n    &lt;/div&gt;\n    &lt;div id=\&quot;records\&quot;&gt;&lt;/div&gt;\n    &lt;p class=\&quot;note\&quot;&gt;保存先はこのブラウザ内です。ブラウザのデータ削除や端末変更で消えることがあるため、定期的にCSVを書き出してください。&lt;/p&gt;\n  &lt;/section&gt;\n&lt;/main&gt;\n&lt;script&gt;\nconst $=id=&gt;document.getElementById(id);\nconst fields=[&#x27;workDate&#x27;,&#x27;routeName&#x27;,&#x27;vehicleNo&#x27;,&#x27;employeeNo&#x27;,&#x27;breakMinutes&#x27;,&#x27;kmDepart&#x27;,&#x27;kmFirst&#x27;,&#x27;kmLast&#x27;,&#x27;kmReturn&#x27;,&#x27;fuelAmount&#x27;,&#x27;fuelDistance&#x27;];\nconst timeInputMap={depart:&#x27;timeDepartInput&#x27;,first:&#x27;timeFirstInput&#x27;,last:&#x27;timeLastInput&#x27;,return:&#x27;timeReturnInput&#x27;};\nconst DRAFT_KEY=&#x27;truckDistanceTimeDraftV1&#x27;;\nlet draftTimer=null;\n// コース・車番・社員番号は数字のみ入力できるようにする（先頭の0は保持）\n[&#x27;routeName&#x27;,&#x27;vehicleNo&#x27;,&#x27;employeeNo&#x27;].forEach(id=&gt;$(id).addEventListener(&#x27;input&#x27;,()=&gt;{const pos=$(id).selectionStart;const before=$(id).value;const after=before.replace(/[^0-9]/g,&#x27;&#x27;);if(before!==after){$(id).value=after;try{$(id).setSelectionRange(pos-(before.length-after.length),pos-(before.length-after.length))}catch(e){}}}));\nconst timeKeys=[&#x27;depart&#x27;,&#x27;first&#x27;,&#x27;last&#x27;,&#x27;return&#x27;];\nlet times={depart:&#x27;&#x27;,first:&#x27;&#x27;,last:&#x27;&#x27;,return:&#x27;&#x27;}, editingId=null;\nconst today=()=&gt;{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,&#x27;0&#x27;)}-${String(d.getDate()).padStart(2,&#x27;0&#x27;)}`};\n$(&#x27;workDate&#x27;).value=today();\nlet autoDateAnchor=today();\nconst num=id=&gt;{const v=$(id).value;return v===&#x27;&#x27;?null:Number(v)};\nconst fmt=n=&gt;n===null||!Number.isFinite(n)?&#x27;—&#x27;:`${n.toLocaleString(&#x27;ja-JP&#x27;,{maximumFractionDigits:1})} km`;\nfunction diff(a,b){const x=num(a),y=num(b);return x!==null&amp;&amp;y!==null&amp;&amp;y&gt;=x?y-x:null}\nfunction duration(a,b){if(!times[a]||!times[b])return null;let [ah,am]=times[a].split(&#x27;:&#x27;).map(Number),[bh,bm]=times[b].split(&#x27;:&#x27;).map(Number);let m=bh*60+bm-(ah*60+am);if(m&lt;0)m+=1440;return m}\nfunction fmtDuration(m){return m===null?&#x27;—&#x27;:`${Math.floor(m/60)}時間${m%60}分`}\nfunction update(){\n $(&#x27;totalKm&#x27;).textContent=fmt(diff(&#x27;kmDepart&#x27;,&#x27;kmReturn&#x27;));\n $(&#x27;firstKm&#x27;).textContent=fmt(diff(&#x27;kmDepart&#x27;,&#x27;kmFirst&#x27;));\n $(&#x27;deliveryKm&#x27;).textContent=fmt(diff(&#x27;kmFirst&#x27;,&#x27;kmLast&#x27;));\n $(&#x27;returnKm&#x27;).textContent=fmt(diff(&#x27;kmLast&#x27;,&#x27;kmReturn&#x27;));\n timeKeys.forEach(k=&gt;{ if($(timeInputMap[k]).value!==(times[k]||&#x27;&#x27;)) $(timeInputMap[k]).value=times[k]||&#x27;&#x27;; });\n}\nconst kmTimeMap={kmDepart:&#x27;depart&#x27;,kmFirst:&#x27;first&#x27;,kmLast:&#x27;last&#x27;,kmReturn:&#x27;return&#x27;};\n[&#x27;kmDepart&#x27;,&#x27;kmFirst&#x27;,&#x27;kmLast&#x27;,&#x27;kmReturn&#x27;].forEach(id=&gt;{\n  // 距離欄を確定した時だけ時刻を更新。時刻欄自体は変更不可。\n  $(id).addEventListener(&#x27;change&#x27;,()=&gt;{\n    const timeKey=kmTimeMap[id];\n    if($(id).value.trim()!==&#x27;&#x27;){\n      const d=new Date();\n      times[timeKey]=`${String(d.getHours()).padStart(2,&#x27;0&#x27;)}:${String(d.getMinutes()).padStart(2,&#x27;0&#x27;)}`;\n      $(&#x27;status&#x27;).textContent=`距離の変更に合わせて ${times[timeKey]} を記録しました`;\n    } else {\n      times[timeKey]=&#x27;&#x27;;\n    }\n    update();\n    scheduleDraftSave();\n  });\n  $(id).addEventListener(&#x27;input&#x27;,()=&gt;{update();scheduleDraftSave()});\n});\nfunction setSaveIndicator(message,pending=false){$(&#x27;saveIndicatorText&#x27;).textContent=message;$(&#x27;saveIndicator&#x27;).classList.toggle(&#x27;pending&#x27;,pending)}\nfunction currentDraft(){return {fields:Object.fromEntries(fields.map(id=&gt;[id,$(id).value])),times:{...times},editingId,updatedAt:new Date().toISOString()}}\nfunction scheduleDraftSave(){setSaveIndicator(&#x27;入力内容を保存中…&#x27;,true);if(draftTimer)clearTimeout(draftTimer);draftTimer=setTimeout(()=&gt;{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(currentDraft()));setSaveIndicator(&#x27;入力内容を自動保存しました（この端末内）&#x27;)}catch(e){setSaveIndicator(&#x27;自動保存できません。保存ボタンとCSV書き出しを使ってください&#x27;,true)}},250)}\nfunction restoreDraft(){try{const raw=localStorage.getItem(DRAFT_KEY);if(!raw){setSaveIndicator(&#x27;自動保存オン：入力すると自動で保存されます&#x27;);return}const d=JSON.parse(raw);if(d.fields&amp;&amp;typeof d.fields===&#x27;object&#x27;)fields.forEach(id=&gt;{if(d.fields[id]!==undefined)$(id).value=d.fields[id]});times={depart:&#x27;&#x27;,first:&#x27;&#x27;,last:&#x27;&#x27;,return:&#x27;&#x27;,...(d.times||{})};editingId=d.editingId||null;autoDateAnchor=today();if(!editingId &amp;&amp; $(&#x27;workDate&#x27;).value &amp;&amp; $(&#x27;workDate&#x27;).value!==today()){$(&#x27;workDate&#x27;).value=today();}update();$(&#x27;saveBtn&#x27;).textContent=editingId?&#x27;変更を保存&#x27;:&#x27;この日の記録を保存&#x27;;setSaveIndicator(&#x27;前回の入力途中データを復元しました（保存ボタンで記録一覧に登録）&#x27;);if(!editingId)scheduleDraftSave()}catch(e){setSaveIndicator(&#x27;自動保存データを読み込めませんでした&#x27;,true)}}\nfields.forEach(id=&gt;{ $(id).addEventListener(&#x27;input&#x27;,scheduleDraftSave); $(id).addEventListener(&#x27;change&#x27;,scheduleDraftSave); });\n// 時刻表示欄は読み取り専用。時刻は距離欄の変更確定時にのみ更新します。\nwindow.addEventListener(&#x27;pagehide&#x27;,()=&gt;{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(currentDraft()))}catch(e){}});\ndocument.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(document.visibilityState===&#x27;hidden&#x27;){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(currentDraft()))}catch(e){}}});\n// 日付が変わったら、編集中の過去記録は触らず、新規入力の日付だけ更新します。\nfunction refreshWorkDate(){const t=today();if(t===autoDateAnchor)return;if(!editingId &amp;&amp; $(&#x27;workDate&#x27;).value===autoDateAnchor){$(&#x27;workDate&#x27;).value=t;scheduleDraftSave()}autoDateAnchor=t;}\nwindow.addEventListener(&#x27;pageshow&#x27;,refreshWorkDate);\ndocument.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(document.visibilityState===&#x27;visible&#x27;)refreshWorkDate()});\nsetInterval(refreshWorkDate,30000);\nfunction collect(){return {id:editingId||String(Date.now()),date:$(&#x27;workDate&#x27;).value||today(),route:$(&#x27;routeName&#x27;).value,vehicleNo:$(&#x27;vehicleNo&#x27;).value.trim(),employeeNo:$(&#x27;employeeNo&#x27;).value.trim(),times:{...times},breakMinutes:$(&#x27;breakMinutes&#x27;).value,kmDepart:$(&#x27;kmDepart&#x27;).value,kmFirst:$(&#x27;kmFirst&#x27;).value,kmLast:$(&#x27;kmLast&#x27;).value,kmReturn:$(&#x27;kmReturn&#x27;).value,fuelAmount:$(&#x27;fuelAmount&#x27;).value,fuelDistance:$(&#x27;fuelDistance&#x27;).value,updatedAt:new Date().toISOString()}}\nfunction getRecords(){try{return JSON.parse(localStorage.getItem(&#x27;truckDistanceTimeRecords&#x27;)||&#x27;[]&#x27;)}catch(e){return []}}\nfunction setRecords(a){localStorage.setItem(&#x27;truckDistanceTimeRecords&#x27;,JSON.stringify(a))}\nfunction resetForm(){editingId=null;fields.forEach(id=&gt;$(id).value=&#x27;&#x27;);$(&#x27;workDate&#x27;).value=today();times={depart:&#x27;&#x27;,first:&#x27;&#x27;,last:&#x27;&#x27;,return:&#x27;&#x27;};$(&#x27;status&#x27;).textContent=&#x27;&#x27;;update();$(&#x27;saveBtn&#x27;).textContent=&#x27;この日の記録を保存&#x27;;scheduleDraftSave()}\n$(&#x27;saveBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{\n const r=collect();if(!r.date){$(&#x27;status&#x27;).textContent=&#x27;日付を入力してください&#x27;;return}\n let arr=getRecords(),idx=arr.findIndex(x=&gt;x.id===r.id);\n if(idx&gt;=0)arr[idx]=r;else arr.unshift(r);\n setRecords(arr);$(&#x27;status&#x27;).textContent=&#x27;保存しました&#x27;;renderRecords();editingId=null;$(&#x27;saveBtn&#x27;).textContent=&#x27;この日の記録を保存&#x27;;try{localStorage.removeItem(DRAFT_KEY)}catch(e){};setSaveIndicator(&#x27;記録一覧に保存済みです&#x27;)\n});\nfunction loadRecord(r){editingId=r.id;$(&#x27;workDate&#x27;).value=r.date||today();$(&#x27;routeName&#x27;).value=r.route||&#x27;&#x27;;$(&#x27;vehicleNo&#x27;).value=r.vehicleNo||&#x27;&#x27;;$(&#x27;employeeNo&#x27;).value=r.employeeNo||&#x27;&#x27;;$(&#x27;breakMinutes&#x27;).value=r.breakMinutes||&#x27;&#x27;;$(&#x27;kmDepart&#x27;).value=r.kmDepart||&#x27;&#x27;;$(&#x27;kmFirst&#x27;).value=r.kmFirst||&#x27;&#x27;;$(&#x27;kmLast&#x27;).value=r.kmLast||&#x27;&#x27;;$(&#x27;kmReturn&#x27;).value=r.kmReturn||&#x27;&#x27;;$(&#x27;fuelAmount&#x27;).value=r.fuelAmount||&#x27;&#x27;;$(&#x27;fuelDistance&#x27;).value=r.fuelDistance||&#x27;&#x27;;times={depart:&#x27;&#x27;,first:&#x27;&#x27;,last:&#x27;&#x27;,return:&#x27;&#x27;,...(r.times||{})};$(&#x27;saveBtn&#x27;).textContent=&#x27;変更を保存&#x27;;$(&#x27;status&#x27;).textContent=&#x27;記録を読み込みました&#x27;;update();scheduleDraftSave();window.scrollTo({top:0,behavior:&#x27;smooth&#x27;})}\nfunction renderRecords(){\n const arr=getRecords(),root=$(&#x27;records&#x27;);root.innerHTML=&#x27;&#x27;;\n if(!arr.length){root.innerHTML=&#x27;&lt;div class=\&quot;empty\&quot;&gt;まだ記録がありません。&lt;br&gt;上で時刻と距離を入力して保存してください。&lt;/div&gt;&#x27;;return}\n arr.sort((a,b)=&gt;(b.date||&#x27;&#x27;).localeCompare(a.date||&#x27;&#x27;));\n arr.forEach(r=&gt;{\n  const el=document.createElement(&#x27;div&#x27;);el.className=&#x27;record&#x27;;\n  const km=(r.kmDepart!==&#x27;&#x27;&amp;&amp;r.kmReturn!==&#x27;&#x27;&amp;&amp;Number(r.kmReturn)&gt;=Number(r.kmDepart))?fmt(Number(r.kmReturn)-Number(r.kmDepart)):&#x27;距離未完了&#x27;;\n  const t=r.times||{};\n  el.innerHTML=`&lt;div class=\&quot;recordtop\&quot;&gt;&lt;div&gt;&lt;strong&gt;&lt;/strong&gt;&lt;br&gt;&lt;small&gt;&lt;/small&gt;&lt;/div&gt;&lt;strong class=\&quot;km\&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div class=\&quot;recordstats\&quot;&gt;&lt;/div&gt;&lt;div class=\&quot;recordactions\&quot;&gt;&lt;button class=\&quot;secondary edit\&quot;&gt;編集&lt;/button&gt;&lt;button class=\&quot;danger delete\&quot;&gt;削除&lt;/button&gt;&lt;/div&gt;`;\n  el.querySelector(&#x27;strong&#x27;).textContent=r.date||&#x27;日付なし&#x27;;el.querySelector(&#x27;small&#x27;).textContent=r.route||&#x27;コース名なし&#x27;;el.querySelector(&#x27;.km&#x27;).textContent=km;\n  const stats=el.querySelector(&#x27;.recordstats&#x27;);\n  const point=(time,km)=&gt;`${time||&#x27;—&#x27;} / ${km!==undefined&amp;&amp;km!==null&amp;&amp;km!==&#x27;&#x27;?fmt(Number(km))+&#x27; km&#x27;:&#x27;距離—&#x27;}`;\n  stats.textContent=`車番 ${r.vehicleNo||&#x27;—&#x27;}　社員番号 ${r.employeeNo||&#x27;—&#x27;}\\n出発 ${point(t.depart,r.kmDepart)}\\n1件目 ${point(t.first,r.kmFirst)}\\n最終納品 ${point(t.last,r.kmLast)}\\n帰着 ${point(t.return,r.kmReturn)}\\n休憩 ${r.breakMinutes||&#x27;—&#x27;} 分`;\n  stats.style.whiteSpace=&#x27;pre-line&#x27;;\n  el.querySelector(&#x27;.edit&#x27;).onclick=()=&gt;loadRecord(r);\n  el.querySelector(&#x27;.delete&#x27;).onclick=()=&gt;{if(confirm(`${r.date} の記録を削除しますか？`)){setRecords(getRecords().filter(x=&gt;x.id!==r.id));renderRecords()}};\n  root.appendChild(el);\n });\n}\n$(&#x27;newBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{resetForm();window.scrollTo({top:0,behavior:&#x27;smooth&#x27;})});\n$(&#x27;exportBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{\n const arr=getRecords();if(!arr.length){alert(&#x27;書き出す記録がありません&#x27;);return}\n const headers=[&#x27;日付&#x27;,&#x27;コース&#x27;,&#x27;車番&#x27;,&#x27;社員番号&#x27;,&#x27;出発時刻&#x27;,&#x27;1件目時刻&#x27;,&#x27;最終納品時刻&#x27;,&#x27;帰着時刻&#x27;,&#x27;休憩(分)&#x27;,&#x27;出発距離(km)&#x27;,&#x27;1件目距離(km)&#x27;,&#x27;最終納品距離(km)&#x27;,&#x27;帰着距離(km)&#x27;,&#x27;総走行距離(km)&#x27;,&#x27;給油量(L)&#x27;,&#x27;給油時走行距離(km)&#x27;];\n const esc=v=&gt;&#x27;\&quot;&#x27;+String(v??&#x27;&#x27;).replace(/\&quot;/g,&#x27;\&quot;\&quot;&#x27;)+&#x27;\&quot;&#x27;;\n const rows=arr.map(r=&gt;[r.date,r.route,r.vehicleNo,r.employeeNo,r.times?.depart,r.times?.first,r.times?.last,r.times?.return,r.breakMinutes,r.kmDepart,r.kmFirst,r.kmLast,r.kmReturn,(r.kmDepart!==&#x27;&#x27;&amp;&amp;r.kmReturn!==&#x27;&#x27;&amp;&amp;Number(r.kmReturn)&gt;=Number(r.kmDepart))?Number(r.kmReturn)-Number(r.kmDepart):&#x27;&#x27;,r.fuelAmount,r.fuelDistance].map(esc).join(&#x27;,&#x27;));\n const blob=new Blob([&#x27;\\ufeff&#x27;+[headers.map(esc).join(&#x27;,&#x27;),...rows].join(&#x27;\\r\\n&#x27;)],{type:&#x27;text/csv;charset=utf-8;&#x27;});\n const url=URL.createObjectURL(blob),a=document.createElement(&#x27;a&#x27;);a.href=url;a.download=&#x27;トラック距離時間メモ.csv&#x27;;a.click();URL.revokeObjectURL(url);\n});\n$(&#x27;textExportBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{\n const arr=getRecords();if(!arr.length){alert(&#x27;書き出す記録がありません&#x27;);return}\n const distance=(a,b)=&gt;a!==&#x27;&#x27;&amp;&amp;b!==&#x27;&#x27;&amp;&amp;Number(b)&gt;=Number(a)?`${(Number(b)-Number(a)).toLocaleString(&#x27;ja-JP&#x27;,{maximumFractionDigits:1})} km`:&#x27;未計算&#x27;;\n const lines=arr.slice().sort((a,b)=&gt;(b.date||&#x27;&#x27;).localeCompare(a.date||&#x27;&#x27;)).map((r,i)=&gt;{\n  const t=r.times||{};\n  return [\n   `【記録 ${i+1}】 ${r.date||&#x27;日付なし&#x27;}`,\n   `コース：${r.route||&#x27;—&#x27;}　車番：${r.vehicleNo||&#x27;—&#x27;}　社員番号：${r.employeeNo||&#x27;—&#x27;}`,\n   `出発：${t.depart||&#x27;—&#x27;}（${r.kmDepart||&#x27;—&#x27;} km）`,\n   `1件目：${t.first||&#x27;—&#x27;}（${r.kmFirst||&#x27;—&#x27;} km）`,\n   `最終納品：${t.last||&#x27;—&#x27;}（${r.kmLast||&#x27;—&#x27;} km）`,\n   `帰着：${t.return||&#x27;—&#x27;}（${r.kmReturn||&#x27;—&#x27;} km）`,\n   `総走行距離：${distance(r.kmDepart,r.kmReturn)}`,\n   `休憩：${r.breakMinutes||&#x27;—&#x27;} 分`,\n   `給油量：${r.fuelAmount||&#x27;—&#x27;} L`,\n   `給油時の走行距離：${r.fuelDistance||&#x27;—&#x27;} km`\n  ].join(&#x27;\\n&#x27;);\n });\n const blob=new Blob([lines.join(&#x27;\\n\\n--------------------\\n\\n&#x27;)],{type:&#x27;text/plain;charset=utf-8;&#x27;});\n const url=URL.createObjectURL(blob),a=document.createElement(&#x27;a&#x27;);a.href=url;a.download=&#x27;トラック距離時間メモ.txt&#x27;;a.click();URL.revokeObjectURL(url);\n});\nrestoreDraft();update();renderRecords();\n&lt;/script&gt;\n&lt;script&gt;\nif (\&quot;serviceWorker\&quot; in navigator &amp;&amp; location.protocol.startsWith(\&quot;http\&quot;)) {\n  window.addEventListener(\&quot;load\&quot;, () =&gt; navigator.serviceWorker.register(\&quot;./sw.js\&quot;).catch(() =&gt; {}));\n}\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;"></iframe></section><section id="deliveryPanel" class="hidden"><div class="tabs"><button onclick="tab('my')">記録一覧</button><button onclick="tab('input')">＋ 実績入力</button></div>
<section id="input" class="card hidden"><h2 class="section-title">配送実績入力</h2><div class="grid"><label>日付<input id="date" type="date" required></label><label>配送件数<input id="deliveryCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>個配件数<input id="kohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>ペア個配件数<input id="pairKohaCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>実配件数<input id="actualCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>新規件数<input id="newCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班件数<input id="teamCount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>班配布枚数<input id="teamSheets" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label class="amount">供給金額（円）<input id="supplyAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label></div><div id="validation" class="errors ok" aria-live="polite">数値を入力すると、エラーを確認できます。</div><div class="form-actions"><button id="saveButton" onclick="addRecord()">記録を保存</button><button class="secondary" onclick="clearForm()">入力をクリア</button></div></section>
<section id="my" class="card"><h2 class="section-title">記録一覧</h2><div id="mySummary" class="summary"></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>日付</th><th>配送件数</th><th>個配件数</th><th>ペア個配件数</th><th>実配件数</th><th>新規件数</th><th>班件数</th><th>班配布枚数</th><th>供給金額</th><th>エラー確認</th><th>操作</th></tr></thead><tbody id="myRows"></tbody></table></div><p id="myEmpty" class="note">まだ記録がありません。</p></section>
</section></main></div>
<script>
const STORAGE_KEY='deliveryWfmRecords';
const fields=['deliveryCount','kohaCount','pairKohaCount','actualCount','newCount','teamCount','teamSheets','supplyAmount'];
const labels={deliveryCount:'配送件数',kohaCount:'個配件数',pairKohaCount:'ペア個配件数',actualCount:'実配件数',newCount:'新規件数',teamCount:'班件数',teamSheets:'班配布枚数',supplyAmount:'供給金額'};
let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'),employee='',editingId=null;
// 数値欄をユーザーが明示的に入力・確認したかを記録。初期値の0だけでは検証を開始しない。
let touchedFields=new Set();
records.forEach(r=>{if(!r.id)r.id=makeId()});
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)}
function loginUser(){employee=document.getElementById('empId').value.trim();if(!employee)return alert('社員番号を入力してください');sessionStorage.setItem('wfmEmployee',employee);start()}
function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('user').innerHTML='ログイン中：<span class="badge">社員番号 '+esc(employee)+'</span>';document.getElementById('date').value=localDate();tab('my');save()}
function logout(){sessionStorage.removeItem('wfmEmployee');location.reload()}
function tab(t){['input','my'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));if(t==='my')renderMy();if(t==='input')validateForm()}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function num(id){return Math.max(0,Number(document.getElementById(id).value)||0)}
function valuesFromForm(){const v={};fields.forEach(k=>v[k]=num(k));return v}
function getErrors(r){
 const e=[],delivery=Number(r.deliveryCount)||0,koha=Number(r.kohaCount)||0,pair=Number(r.pairKohaCount)||0,actual=Number(r.actualCount)||0,newc=Number(r.newCount)||0,sheets=Number(r.teamSheets)||0;
 const sum2=koha+pair*2, sum3=koha+sheets+pair*2;
 const mismatch=(sum)=>{const diff=sum-delivery;return diff>0?`${diff}件多い`:diff<0?`${Math.abs(diff)}件不足`:'一致'};
 if(actual>delivery)e.push({code:1,fields:['actualCount','deliveryCount'],message:`① 実配件数 ${actual}件 が配送件数 ${delivery}件 を超えています（${actual-delivery}件超過）。`});
 if(sum2!==delivery)e.push({code:2,fields:['kohaCount','pairKohaCount','deliveryCount'],message:`② 個配件数 ${koha}件 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum2}件。配送件数は ${delivery}件のため、${mismatch(sum2)}です。`});
 if(sum3!==delivery)e.push({code:3,fields:['kohaCount','teamSheets','pairKohaCount','deliveryCount'],message:`③ 個配件数 ${koha}件 ＋ 班配布枚数 ${sheets}枚 ＋ ペア個配件数 ${pair}件 × 2 ＝ ${sum3}件。配送件数は ${delivery}件のため、${mismatch(sum3)}です。`});
 // 新規件数を含めると②または③の内訳が配送件数に一致する場合、④の可能性を表示
 const sum2WithNew=sum2+newc, sum3WithNew=sum3+newc;
 if(newc>0 && ((sum2WithNew===delivery && sum2!==delivery)||(sum3WithNew===delivery && sum3!==delivery))){
   const cases=[]; if(sum2WithNew===delivery&&sum2!==delivery)cases.push(`②の内訳 ${sum2}件 ＋ 新規件数 ${newc}件 ＝ ${sum2WithNew}件`); if(sum3WithNew===delivery&&sum3!==delivery)cases.push(`③の内訳 ${sum3}件 ＋ 新規件数 ${newc}件 ＝ ${sum3WithNew}件`);
   e.push({code:4,fields:['newCount','deliveryCount','kohaCount','pairKohaCount','teamSheets'],message:`④ 新規件数の計上方法を確認してください。${cases.join('／')}となり、配送件数 ${delivery}件と一致します。新規件数の扱いが内訳に反映されていない可能性があります。`});
 }
 return e;
}
function validateForm(){
 const box=document.getElementById('validation');if(!box)return;
 // 毎回いったん赤枠を解除。8つの数値欄をユーザーがすべて入力・確認するまでは検証しない。
 fields.forEach(k=>document.getElementById(k).classList.remove('invalid'));
 const allValuesPresent=!!document.getElementById('date').value && fields.every(k=>document.getElementById(k).value.trim()!=='');
 const allFieldsTouched=fields.every(k=>touchedFields.has(k));
 if(!allValuesPresent || !allFieldsTouched){
   box.classList.add('ok');
   box.innerHTML='<strong>入力待ち</strong><div class="note">配送件数だけでなく、8つすべての数値欄を入力・確認するとエラーチェックを開始します。0件の項目も、必要なら「0」を入力してください。</div>';
   return;
 }
 const r={...valuesFromForm()},errs=getErrors(r);
 const bad=new Set(errs.flatMap(x=>x.fields));bad.forEach(k=>{const el=document.getElementById(k);if(el)el.classList.add('invalid')});
 box.classList.toggle('ok',errs.length===0);
 box.innerHTML=errs.length?'<strong>入力エラーがあります（赤枠の項目を確認してください）</strong><ul>'+errs.map(x=>'<li><span class="error-detail">'+esc(x.message)+'</span></li>').join('')+'</ul><div class="hint">各エラーには、入力値・計算結果・配送件数との差を表示しています。</div>':'<strong>エラーはありません</strong><div class="note">すべての項目が入力され、設定されたチェック条件を満たしています。</div>';
}
function addRecord(){const date=document.getElementById('date').value;if(!date)return alert('日付を入力してください');const wasEditing=!!editingId;const r={...valuesFromForm(),id:editingId||makeId(),employee,date,createdAt:new Date().toISOString()};if(editingId){const ix=records.findIndex(x=>x.id===editingId&&String(x.employee)===String(employee));if(ix<0){editingId=null;return alert('訂正する記録が見つかりません。')}records[ix]={...records[ix],...r};}else records.unshift(r);save();clearForm();renderMy();tab('my');alert(wasEditing?'記録を訂正しました':'記録を保存しました');editingId=null;document.getElementById('saveButton').textContent='記録を保存'}
function editRecord(id){const r=records.find(x=>x.id===id&&String(x.employee)===String(employee));if(!r)return alert('記録が見つかりません');editingId=id;touchedFields=new Set(fields);document.getElementById('date').value=r.date||localDate();fields.forEach(k=>document.getElementById(k).value=Number(r[k])||0);document.getElementById('saveButton').textContent='訂正内容を保存';tab('input');validateForm();window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editingId=null;touchedFields.clear();fields.forEach(k=>document.getElementById(k).value='');document.getElementById('date').value=localDate();document.getElementById('saveButton').textContent='記録を保存';validateForm()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(k,v){const n=Number(v)||0;return k==='supplyAmount'?n.toLocaleString('ja-JP')+'円':n.toLocaleString('ja-JP')}
function renderMy(){const rs=records.filter(r=>String(r.employee)===String(employee));document.getElementById('mySummary').innerHTML=fields.map(k=>`<div class="metric">${labels[k]} 合計<strong>${fmt(k,rs.reduce((a,r)=>a+(Number(r[k])||0),0))}</strong></div>`).join('');document.getElementById('myRows').innerHTML=rs.map(r=>{const errs=getErrors(r);return `<tr><td>${esc(r.date||'')}</td>${fields.map(k=>`<td>${fmt(k,r[k])}</td>`).join('')}<td class="error-cell">${errs.length?'<ul>'+errs.map(x=>'<li>'+esc(x.message)+'</li>').join('')+'</ul>':'<span class="oktext">エラーなし</span>'}</td><td><button class="editbtn" onclick="editRecord('${esc(r.id)}')">訂正</button><button class="danger" onclick="deleteRecord('${esc(r.id)}')">削除</button></td></tr>`}).join('');document.getElementById('myEmpty').classList.toggle('hidden',rs.length>0)}
function deleteRecord(id){const ix=records.findIndex(r=>r.id===id&&String(r.employee)===String(employee));if(ix<0)return;if(confirm('この記録を削除しますか？')){records.splice(ix,1);save();renderMy()}}
fields.forEach(k=>{const el=document.getElementById(k);const markTouched=()=>{touchedFields.add(k);validateForm()};el.addEventListener('input',markTouched);el.addEventListener('change',markTouched)});
document.getElementById('date').addEventListener('change',validateForm);
if(sessionStorage.getItem('wfmEmployee')){employee=sessionStorage.getItem('wfmEmployee');start()}else{save()}

function mainTab(which){const d=which==='distance';document.getElementById('distancePanel').classList.toggle('hidden',!d);document.getElementById('deliveryPanel').classList.toggle('hidden',d);document.getElementById('distanceTabBtn').classList.toggle('active',d);document.getElementById('deliveryTabBtn').classList.toggle('active',!d);if(!d){tab('my');}else{setTimeout(()=>{const f=document.getElementById('distanceFrame');if(f&&f.contentWindow)f.contentWindow.dispatchEvent(new Event('resize'));},50)}}
</script></body></html>
